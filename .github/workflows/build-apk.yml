name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: |
          bun run build

      - name: Initialize and Sync Capacitor Android
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            bunx --bun @capacitor/cli init "SolveStep" "com.solvestep.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            bunx --bun @capacitor/cli add android
          fi
          bunx --bun @capacitor/cli sync android

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
